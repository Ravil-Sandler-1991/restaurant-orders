<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הזמנות מסעדה</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .setup-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #ffc107;
        }

        .setup-section h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .setup-inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .setup-inputs input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .setup-inputs button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .setup-inputs button:hover {
            background: #5568d3;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        .categories {
            display: grid;
            gap: 20px;
        }

        .category {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .category-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .items-grid {
            display: grid;
            gap: 15px;
        }

        .item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            border-right: 3px solid #667eea;
        }

        .item-name {
            font-weight: 600;
            color: #333;
        }

        .quantity-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .qty-input {
            width: 60px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        .qty-label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .order-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .order-input {
            width: 70px;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
            color: #d32f2f;
        }

        .order-btn {
            padding: 6px 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        .order-btn:hover {
            background: #45a049;
        }

        .order-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .status.low {
            background: #ffebee;
            color: #c62828;
        }

        .status.ok {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.empty {
            background: #fce4ec;
            color: #ad1457;
        }

        .orders-log {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .orders-log h3 {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .order-item {
            padding: 10px;
            background: #f8f9fa;
            border-right: 3px solid #4caf50;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-time {
            font-size: 12px;
            color: #999;
        }

        .demo-notice {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-right: 4px solid #2196f3;
        }

        .demo-notice h4 {
            color: #1976d2;
            margin-bottom: 8px;
        }

        .demo-notice p {
            color: #0d47a1;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .demo-notice code {
            background: white;
            padding: 8px;
            border-radius: 4px;
            display: inline-block;
            margin: 5px 0;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .item {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .filters {
                gap: 5px;
            }

            .filter-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 מערכת הזמנות מסעדה - ריאל טיים</h1>
            <p style="color: #666; margin-top: 5px;">סנכרון חי בין כל העובדים</p>
        </div>

        <div class="demo-notice">
            <h4>🚀 כדי להפעיל סנכרון אמיתי:</h4>
            <p><strong>1. צור חשבון Supabase בחינם:</strong></p>
            <code>https://supabase.com</code>
            <p><strong>2. הגדר את ה-API keys כאן:</strong></p>
            <div class="setup-inputs">
                <input type="text" id="supabaseUrl" placeholder="Supabase URL" value="">
                <input type="text" id="supabaseKey" placeholder="Supabase Anon Key" value="">
                <button onclick="setupSupabase()">חיבור</button>
            </div>
            <p style="margin-top: 10px; font-size: 12px;">בינתיים - בואו נעבוד עם localStorage (סנכרון בתוך המכשיר בלבד)</p>
        </div>

        <div class="filters" id="filters"></div>

        <div class="categories" id="categories"></div>

        <div class="orders-log">
            <h3>📋 רישום הזמנות אחרונות</h3>
            <div id="ordersList" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // Inventory data structured by category
        const inventory = {
            'ירקות ועשבי תיבול': [
                'לבבות קיסר',
                'עגבניות שרי',
                'עגבניות לרוטב',
                'בצל סגול',
                'שום טרי',
                'שום קונפי',
                'בזיליקום',
                'רוקט',
                'פטרוזיליה',
                'צ\'ילי אדום',
                'חלפיניו',
                'לימונים'
            ],
            'אנטיפסטי ותוספות': [
                'ארטישוק א-לה רומאנה',
                'זיתי קלמטה',
                'קרוטונים',
                'פוקצ\'ה'
            ],
            'גבינות': [
                'מוצרלה פרסקה',
                'בוראטה',
                'פרמז\'ן רג\'אנו',
                'ריקוטה',
                'מסקרפונה'
            ],
            'פטריות': [
                'שמפיניון',
                'פורטובלו'
            ],
            'פסטות': [
                'ספגטי',
                'פטוצ\'יני',
                'ריגטוני',
                'בוסיאטה',
                'רדיאטורה',
                'ניוקי',
                'אנילוטי סלק ומסקרפונה',
                'אנילוטי פטריות וריקוטה',
                'פסטה ללא גלוטן'
            ],
            'רטבים': [
                'נפולי',
                'שמנת',
                'רוזה',
                'ארביאטה',
                'טרטופו',
                'שמנת פסטו',
                'חמאה, זעתר וערמונים'
            ],
            'פיצה': [
                'כדורי בצק',
                'רוטב עגבניות לפיצה',
                'מוצרלה לפיצה',
                'פרמז\'ן לפיצה'
            ],
            'מוצרי מזווה': [
                'שמן זית',
                'מלח',
                'פלפל שחור',
                'אורגנו יבש',
                'פתיתי צ\'ילי',
                'אגוז מוסקט',
                'כמהין / מחית כמהין'
            ],
            'הכנות (Prep)': [
                'רוטב נפולי מוכן',
                'רוטב שמנת מוכן',
                'רוטב רוזה מוכן',
                'רוטב ארביאטה מוכן',
                'רוטב טרטופו מוכן',
                'שמנת פסטו מוכנה',
                'חמאה, זעתר וערמונים מוכנים',
                'שום קונפי מוכן',
                'פרמז\'ן מגורר',
                'מוצרלה חתוכה',
                'בוראטה מוכנה להגשה',
                'ירקות שטופים וחתוכים',
                'חסה שטופה ויבשה',
                'פוקצ\'ות מוכנות',
                'קרוטונים מוכנים'
            ],
            'ציוד': [
                'קופסאות טייק־אווי',
                'מכסים',
                'סכו"ם',
                'מפיות',
                'שקיות משלוח',
                'מדבקות',
                'כפפות',
                'ניילון נצמד',
                'נייר אפייה'
            ]
        };

        let supabase = null;
        let items = {};
        let activeFilter = 'הכל';
        let realtimeSubscription = null;

        // Initialize
        function init() {
            loadFromStorage();
            renderUI();
            setupEventListeners();
        }

        // Storage functions
        function loadFromStorage() {
            const stored = localStorage.getItem('restaurantInventory');
            if (stored) {
                items = JSON.parse(stored);
            } else {
                // Initialize all items
                for (const [category, itemList] of Object.entries(inventory)) {
                    for (const item of itemList) {
                        items[item] = {
                            category,
                            current: 0,
                            unit: 'יח\'',
                            lastOrdered: null
                        };
                    }
                }
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('restaurantInventory', JSON.stringify(items));
        }

        // Supabase setup
        async function setupSupabase() {
            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();

            if (!url || !key) {
                alert('אנא הזן את URL ו-API Key של Supabase');
                return;
            }

            try {
                supabase = window.supabase.createClient(url, key);
                
                // Test connection
                const { data, error } = await supabase.from('restaurant_items').select('*').limit(1);
                
                if (error && error.code === 'PGRST116') {
                    // Table doesn't exist yet
                    alert('יש ליצור טבלה ב-Supabase.\n\nהוסף את ה-SQL הבא:\n\nCREATE TABLE restaurant_items (\n  id SERIAL PRIMARY KEY,\n  name TEXT UNIQUE,\n  category TEXT,\n  current INTEGER DEFAULT 0,\n  unit TEXT DEFAULT \'יח\\\"\',\n  updated_at TIMESTAMP DEFAULT NOW(),\n  updated_by TEXT\n);');
                    return;
                } else if (error) {
                    throw error;
                }

                alert('✅ חיבור הצליח! עכשיו הנתונים שלך מסונכרנים בשרת');
                document.querySelector('.demo-notice').style.display = 'none';
                
                // Load from Supabase
                await loadFromSupabase();
                setupRealtimeSync();
            } catch (error) {
                alert('❌ שגיאה בחיבור: ' + error.message);
            }
        }

        async function loadFromSupabase() {
            const { data, error } = await supabase.from('restaurant_items').select('*');
            if (error) {
                console.error('Error loading:', error);
                return;
            }

            data.forEach(row => {
                items[row.name] = {
                    category: row.category,
                    current: row.current,
                    unit: row.unit,
                    lastOrdered: row.updated_at
                };
            });
            renderUI();
        }

        function setupRealtimeSync() {
            if (realtimeSubscription) {
                supabase.removeSubscription(realtimeSubscription);
            }

            realtimeSubscription = supabase
                .from('restaurant_items')
                .on('*', payload => {
                    if (payload.eventType === 'UPDATE') {
                        const updated = payload.new;
                        items[updated.name].current = updated.current;
                        renderUI();
                        addOrderLog(`${updated.name} עודכן ל-${updated.current} (סנכרון בשרת)`);
                    }
                })
                .subscribe();
        }

        // Update quantity
        async function updateQuantity(itemName, value) {
            items[itemName].current = parseInt(value) || 0;
            saveToStorage();

            if (supabase) {
                const { error } = await supabase
                    .from('restaurant_items')
                    .upsert({
                        name: itemName,
                        category: items[itemName].category,
                        current: items[itemName].current,
                        unit: items[itemName].unit,
                        updated_by: 'עובד'
                    });
                if (error) console.error('Update error:', error);
            }

            renderUI();
        }

        // Place order
        async function placeOrder(itemName, quantity) {
            const newQty = items[itemName].current - quantity;
            if (newQty < 0) {
                alert(`אין מספיק ${itemName}`);
                return;
            }

            items[itemName].current = newQty;
            items[itemName].lastOrdered = new Date().toISOString();
            saveToStorage();

            if (supabase) {
                const { error } = await supabase
                    .from('restaurant_items')
                    .upsert({
                        name: itemName,
                        category: items[itemName].category,
                        current: newQty,
                        unit: items[itemName].unit,
                        updated_by: 'הזמנה'
                    });
                if (error) console.error('Order error:', error);
            }

            addOrderLog(`הוזמן: ${quantity} ${items[itemName].unit} של ${itemName}`);
            document.querySelector(`input[data-order-${itemName}]`).value = '1';
            renderUI();
        }

        // Order log
        function addOrderLog(message) {
            const logs = JSON.parse(localStorage.getItem('orderLogs')) || [];
            logs.unshift({
                time: new Date().toLocaleTimeString('he-IL'),
                message: message
            });
            logs.splice(50); // Keep last 50
            localStorage.setItem('orderLogs', JSON.stringify(logs));
            renderOrderLog();
        }

        function renderOrderLog() {
            const logs = JSON.parse(localStorage.getItem('orderLogs')) || [];
            const html = logs.map(log => 
                `<div class="order-item">
                    <span>${log.message}</span>
                    <span class="order-time">${log.time}</span>
                </div>`
            ).join('');
            document.getElementById('ordersList').innerHTML = html || '<p style="color: #999;">אין הזמנות עדיין</p>';
        }

        // UI Rendering
        function renderUI() {
            renderFilters();
            renderCategories();
            renderOrderLog();
        }

        function renderFilters() {
            const categories = ['הכל', ...Object.keys(inventory)];
            const html = categories.map(cat => 
                `<button class="filter-btn ${activeFilter === cat ? 'active' : ''}" onclick="setFilter('${cat}')">${cat}</button>`
            ).join('');
            document.getElementById('filters').innerHTML = html;
        }

        function renderCategories() {
            let html = '';
            for (const [category, itemList] of Object.entries(inventory)) {
                if (activeFilter !== 'הכל' && activeFilter !== category) continue;

                html += `<div class="category">
                    <div class="category-title">${category}</div>
                    <div class="items-grid">`;

                for (const itemName of itemList) {
                    const item = items[itemName];
                    const current = item.current;
                    let status = 'ok';
                    if (current === 0) status = 'empty';
                    else if (current < 5) status = 'low';

                    html += `<div class="item">
                        <div class="item-name">${itemName}</div>
                        <div class="quantity-group">
                            <span class="qty-label">בעמדה:</span>
                            <input type="number" class="qty-input" value="${current}" min="0" 
                                   onchange="updateQuantity('${itemName}', this.value)">
                        </div>
                        <div class="order-group">
                            <span class="qty-label">הזמנה:</span>
                            <input type="number" class="qty-input order-input" value="1" min="1" data-order-${itemName}>
                            <button class="order-btn" onclick="placeOrder('${itemName}', parseInt(document.querySelector('input[data-order-${itemName}]').value))">הזמן</button>
                        </div>
                        <div class="status ${status}">
                            ${status === 'empty' ? '⚠️ נגמר' : status === 'low' ? '⚠️ נמוך' : '✓ בסדר'}
                        </div>
                    </div>`;
                }

                html += `</div></div>`;
            }
            document.getElementById('categories').innerHTML = html;
        }

        function setFilter(category) {
            activeFilter = category;
            renderUI();
        }

        function setupEventListeners() {
            // Allow real-time input
            document.addEventListener('input', (e) => {
                if (e.target.classList.contains('qty-input')) {
                    // Auto-save
                    clearTimeout(window.autoSaveTimeout);
                    window.autoSaveTimeout = setTimeout(() => {
                        saveToStorage();
                    }, 500);
                }
            });
        }

        // Start
        init();
    </script>
</body>
</html>
